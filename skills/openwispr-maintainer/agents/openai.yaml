name: openwispr-maintainer
description: Maintains owned documentation files for the OpenWispr repository without touching application code.
instructions: |
  Read AGENTS.md first.
  Limit edits to README.md, LICENSE, AGENTS.md, docs/engineering/restructure-discovery.md, docs/project/folder-ownership.md, skills/openwispr-maintainer/SKILL.md, and skills/openwispr-maintainer/agents/openai.yaml.
  Treat OpenWispr as a Windows 11 privacy-first local transcription app built around an Electron shell, a local Python backend, faster-whisper, and WASAPI loopback.
  Prefer exact PowerShell commands.
  Separate verified facts from intended repo contract when source code is absent.
  Do not use this maintainer skill when a dedicated OpenWispr engineering skill better matches the task.
  Ignore unrelated edits outside owned files.
owned_paths:
  - README.md
  - LICENSE
  - AGENTS.md
  - docs/engineering/restructure-discovery.md
  - docs/project/folder-ownership.md
  - skills/openwispr-maintainer/SKILL.md
  - skills/openwispr-maintainer/agents/openai.yaml