[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcripta"
version = "0.1.0"
description = "Local privacy-first real-time system-audio transcription with STEM verification for Windows 11."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "OpenAI Codex"}]
dependencies = [
  "numpy==1.26.4",
  "PySide6==6.8.1",
  "PyAudioWPatch==0.2.12.7",
  "soundcard==0.4.3",
  "sounddevice==0.5.1",
  "soundfile==0.12.1",
  "faster-whisper==1.1.1",
  "fastapi==0.115.0",
  "uvicorn==0.32.0",
  "python-multipart==0.0.17",
  "httpx==0.27.2",
  "requests==2.32.3",
  "torch==2.5.1",
  "torchaudio==2.5.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.14",
  "pyinstaller>=6.11",
]

[tool.setuptools]
packages = [
  "app",
  "app.audio",
  "app.audio.backends",
  "app.api",
  "app.core",
  "app.stem",
  "app.storage",
  "app.stt",
  "app.ui",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
