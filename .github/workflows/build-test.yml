name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: Lint Python
        run: pnpm run lint:python

      - name: Lint Frontend
        run: pnpm run lint:frontend

      - name: TypeCheck
        run: pnpm run typecheck

      - name: Run Python tests
        run: pnpm run test:backend

      - name: Run Frontend tests
        run: pnpm run test:frontend

      - name: Build Electron
        run: pnpm run build:electron

  e2e:
    runs-on: windows-latest
    needs: build
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install -e ".[test]"
          python -m pip install aiohttp
          python -m pip install pip-audit

      - name: Scan Python dependencies
        run: pip-audit

      - name: Scan Node dependencies
        run: pnpm audit

      - name: Run E2E tests (Python)
        run: pytest e2e/ -v --tb=short
        env:
          E2E_HEADLESS: true
          E2E_RECORD_VIDEO: false
          E2E_SCREENSHOTS: false

      - name: Run E2E tests (Playwright)
        run: pnpm run test:e2e
        env:
          ELECTRON_PATH: ${{ github.workspace }}/node_modules/.bin/electron.cmd
